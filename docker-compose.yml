services:
  mysql:
    image: mysql:8
    container_name: ${MYSQL_CONTAINER_NAME:-commerceagent-mysql}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerceagent}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20


  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ${ETCD_CONTAINER_NAME:-commerceagent-etcd}
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ${MINIO_CONTAINER_NAME:-commerceagent-minio}
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.6.22
    container_name: ${MILVUS_CONTAINER_NAME:-commerceagent-milvus}
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio

volumes:
  mysql-data:
    name: ${MYSQL_DATA_VOLUME:-commerceagent-mysql-data}
  etcd-data:
    name: ${ETCD_DATA_VOLUME:-commerceagent-etcd-data}
  minio-data:
    name: ${MINIO_DATA_VOLUME:-commerceagent-minio-data}
  milvus-data:
    name: ${MILVUS_DATA_VOLUME:-commerceagent-milvus-data}
