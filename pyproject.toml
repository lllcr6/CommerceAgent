[project]
name = "commerceagent"
version = "0.1.0"
description = "Policy-grounded customer support with verified commerce tools and human handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "asyncmy>=0.2.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.3.13",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.28.1",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "pymilvus[milvus-lite]>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

ml = [
    "torch>=2.6",
    "transformers>=4.46",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires MySQL, Milvus, or live MCP processes"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*"]
